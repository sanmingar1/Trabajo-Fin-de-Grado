services:
  - type: web
    name: flask-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    plan: free
    rootDir: backend

  - type: web
    name: react-frontend
    env: node
    buildCommand: "npm install && npm run build"
    startCommand: "serve -s build"
    plan: free
    rootDir: frontend
